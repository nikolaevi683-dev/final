<svg width="1600" height="1600" viewBox="0 0 1600 1600" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

  <defs>

    <radialGradient id="glowWhite" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowGreen" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#76d69a" stop-opacity="0.11"/>
      <stop offset="100%" stop-color="#76d69a" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="lineFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#76d69a" stop-opacity="0"/>
      <stop offset="15%" stop-color="#76d69a" stop-opacity="0.24"/>
      <stop offset="85%" stop-color="#9fd6ff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#9fd6ff" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="areaFade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#76d69a" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#76d69a" stop-opacity="0"/>
    </linearGradient>

    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>

    <filter id="lineBlur" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>

    <pattern id="grid" width="82" height="82" patternUnits="userSpaceOnUse">
      <path d="M 82 0 L 0 0 0 82" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>

    <mask id="gridFade">
      <rect width="1600" height="1600" fill="url(#gridMaskGradient)"/>
    </mask>

    <radialGradient id="gridMaskGradient" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

  </defs>

  <!-- faint graph-paper grid, fading out toward the edges -->
  <rect width="1600" height="1600" fill="url(#grid)" mask="url(#gridFade)"/>

  <!-- soft ambient glows -->
  <circle cx="1180" cy="180" r="420" fill="url(#glowWhite)" filter="url(#softBlur)"/>
  <circle cx="260" cy="1360" r="460" fill="url(#glowGreen)" filter="url(#softBlur)"/>
  <circle cx="150" cy="120" r="300" fill="url(#glowWhite)" filter="url(#softBlur)"/>

  <!-- faint ascending market-line motif, barely visible -->
  <g filter="url(#lineBlur)" opacity="0.55">

    <path
      d="M -40 1120
         C 220 1080, 340 980, 460 1000
         C 600 1024, 660 900, 820 860
         C 980 820, 1040 700, 1200 640
         C 1340 588, 1440 520, 1640 460"
      fill="none"
      stroke="url(#lineFade)"
      stroke-width="2.5"
      stroke-linecap="round"
    />

    <path
      d="M -40 1120
         C 220 1080, 340 980, 460 1000
         C 600 1024, 660 900, 820 860
         C 980 820, 1040 700, 1200 640
         C 1340 588, 1440 520, 1640 460
         L 1640 1600 L -40 1600 Z"
      fill="url(#areaFade)"
      stroke="none"
    />

  </g>

</svg>
